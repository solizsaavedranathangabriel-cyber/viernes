<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f2">
<title>Viernes</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f4;--surface:#fff;--text:#1d2530;--dim:#6b7686;--line:#e2e4e8;--user:#ebece8;--gold:#c98a14;--on-gold:#fff}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--surface:#1c222c;--text:#e7ebf1;--dim:#93a0b3;--line:#2b3340;--user:#232b37;--gold:#f0b84a;--on-gold:#14181f}}
:root[data-theme="dark"]{--bg:#14181f;--surface:#1c222c;--text:#e7ebf1;--dim:#93a0b3;--line:#2b3340;--user:#232b37;--gold:#f0b84a;--on-gold:#14181f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.03em}
.orb{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--gold);position:relative}
.orb::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--gold)}
.orb.habla::after{animation:pulso 1s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(.4)}}
@media (prefers-reduced-motion:reduce){.orb.habla::after{animation:none}}
.ib{background:none;border:0;width:40px;height:40px;border-radius:10px;font-size:18px;color:var(--dim)}
.ib:hover{background:var(--user)}
#chat{flex:1;overflow-y:auto;padding:8px 18px 24px}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.yo{align-self:flex-end;background:var(--user);padding:10px 15px;border-radius:18px;max-width:85%;white-space:pre-wrap;line-height:1.5;word-wrap:break-word}
.ia{font-family:Newsreader,Georgia,serif;font-size:18px;line-height:1.65;word-wrap:break-word}
.ia p{margin:0 0 .8em}.ia ul,.ia ol{margin:0 0 .8em;padding-left:1.3em}
.ia code{background:var(--user);padding:1px 5px;border-radius:5px;font-size:.88em}
.ia pre{background:var(--user);padding:12px;border-radius:10px;overflow-x:auto}
.ia pre code{background:none;padding:0}
.acc{display:flex;gap:4px;margin-top:6px}
.acc button{background:none;border:0;color:var(--dim);font-size:14px;padding:4px 8px;border-radius:8px}
.acc button:hover{background:var(--user)}
.saludo{margin:14vh auto 0;text-align:center;max-width:420px}
.saludo h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:34px;margin:14px 0 6px}
.saludo p{color:var(--dim);margin:0}
.saludo .orb{width:44px;height:44px;margin:auto;border-width:4px}.saludo .orb::after{inset:9px}
#pie{padding:6px 14px 14px}
.comp{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
textarea{width:100%;resize:none;border:0;background:none;color:var(--text);font:inherit;font-size:16px;line-height:1.5;max-height:160px;padding:4px 4px 8px;outline:none}
.fila{display:flex;align-items:center;gap:4px}
.fila .esp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--user);border-radius:999px;padding:4px 10px;font-size:13px}
.chip button{background:none;border:0;margin-left:4px;color:var(--dim)}
.rec{background:#c0392b!important;color:#fff!important}
.on{color:var(--gold)!important}
#enviar{width:38px;height:38px;border-radius:50%;border:0;background:var(--gold);color:var(--on-gold);font-weight:800;font-size:17px}
#enviar:disabled{opacity:.4}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 14px}
dialog label{display:block;margin:12px 0 4px;font-size:14px;color:var(--dim)}
dialog select,dialog input[type=range]{width:100%}
dialog select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.fl{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.fl button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
</style>
</head>
<body>
<header>
 <div class="marca"><div class="orb" id="orb"></div>Viernes</div>
 <div><button class="ib" id="nuevo" aria-label="Nueva conversación">✎</button><button class="ib" id="ajustes" aria-label="Ajustes">⚙</button></div>
</header>
<div id="chat"><div class="col" id="col"></div></div>
<div id="pie">
 <form class="comp" id="f">
  <div class="chips" id="chips"></div>
  <textarea id="txt" rows="1" placeholder="¿En qué piensas?"></textarea>
  <div class="fila">
   <input type="file" id="arch" multiple hidden accept="image/*,audio/*,.pdf,.txt,.md">
   <button type="button" class="ib" id="clip" aria-label="Adjuntar">＋</button>
   <button type="button" class="ib" id="mic" aria-label="Dictar">🎤</button>
   <button type="button" class="ib" id="auto" aria-label="Leer respuestas en voz alta">🔊</button>
   <span class="esp"></span>
   <button class="" id="enviar" aria-label="Enviar">↑</button>
  </div>
 </form>
</div>

<dialog id="dlg">
 <h3>Ajustes</h3>
 <label for="voz">Voz</label><select id="voz"></select>
 <label for="vel">Velocidad</label><input type="range" id="vel" min="0.7" max="1.4" step="0.05" value="1">
 <label for="tono">Tono</label><input type="range" id="tono" min="0.7" max="1.5" step="0.05" value="1">
 <label for="tema">Tema</label>
 <select id="tema"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select>
 <div class="fl"><button id="probar" type="button">Probar voz</button><button id="borrar" type="button">Borrar conversación</button><button id="cerrar" type="button">Cerrar</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const col=$("#col"),chat=$("#chat"),txt=$("#txt"),arch=$("#arch");
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let historial=LS.get("hist",[]),adjuntos=[],ocupado=false;
let ajustes=LS.get("aj",{voz:"",vel:1,tono:1,auto:false,tema:"auto"});

/* ---------- tema ---------- */
function aplicaTema(){const r=document.documentElement;ajustes.tema==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",ajustes.tema)}
aplicaTema();

/* ---------- markdown mínimo ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(t){
  const bloques=[];
  t=t.replace(/```[\w]*\n?([\s\S]*?)```/g,(_,c)=>{bloques.push("<pre><code>"+esc(c)+"</code></pre>");return "\u0000"+(bloques.length-1)+"\u0000"});
  t=esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>");
  const out=[];let lista=null;
  for(const l of t.split("\n")){
    const m=l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if(m){const tipo=/^\s*\d+\./.test(l)?"ol":"ul";if(lista!==tipo){if(lista)out.push("</"+lista+">");out.push("<"+tipo+">");lista=tipo}out.push("<li>"+m[1]+"</li>")}
    else{if(lista){out.push("</"+lista+">");lista=null}out.push(l.trim()?"<p>"+l+"</p>":"")}
  }
  if(lista)out.push("</"+lista+">");
  return out.join("").replace(/\u0000(\d+)\u0000/g,(_,i)=>bloques[i]);
}

/* ---------- voz (síntesis del navegador) ---------- */
const sint=window.speechSynthesis;let voces=[];
function cargaVoces(){
  if(!sint)return;
  voces=sint.getVoices().filter(v=>v.lang.toLowerCase().startsWith("es"));
  const s=$("#voz");s.innerHTML="";
  voces.forEach((v,i)=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";s.appendChild(o)});
  if(ajustes.voz&&voces.some(v=>v.name===ajustes.voz))s.value=ajustes.voz;
}
if(sint){cargaVoces();sint.onvoiceschanged=cargaVoces}
function limpiar(t){return t.replace(/```[\s\S]*?```/g," ").replace(/[*_`#>]/g,"").replace(/\p{Extended_Pictographic}/gu,"").replace(/\s+/g," ").trim()}
function hablar(t){
  if(!sint)return;
  sint.cancel();
  const partes=limpiar(t).match(/[^.!?¡¿\n]+[.!?]*/g)||[];
  const orb=$("#orb");
  partes.forEach((p,i)=>{
    if(!p.trim())return;
    const u=new SpeechSynthesisUtterance(p);
    u.lang="es-ES";
    const v=voces.find(x=>x.name===ajustes.voz);if(v){u.voice=v;u.lang=v.lang}
    u.rate=+ajustes.vel;u.pitch=+ajustes.tono;
    if(i===0)u.onstart=()=>orb.classList.add("habla");
    if(i===partes.length-1)u.onend=u.onerror=()=>orb.classList.remove("habla");
    sint.speak(u);
  });
}
function callar(){if(sint)sint.cancel();$("#orb").classList.remove("habla")}

/* ---------- mensajes ---------- */
function saludo(){
  col.innerHTML='<div class="saludo" id="saludo"><div class="orb"></div><h2>Hola, aquí estoy.</h2><p>Pregúntame lo que quieras o mándame una foto, un audio o un archivo.</p></div>';
}
function añadeYo(t){const d=document.createElement("div");d.className="yo";d.textContent=t;col.appendChild(d);return d}
function añadeIA(t){
  const w=document.createElement("div");
  const c=document.createElement("div");c.className="ia";c.innerHTML=md(t);w.appendChild(c);
  const a=document.createElement("div");a.className="acc";
  const b1=document.createElement("button");b1.textContent="🔊 Escuchar";b1.onclick=()=>hablar(t);
  const b2=document.createElement("button");b2.textContent="⏹";b2.setAttribute("aria-label","Parar");b2.onclick=callar;
  const b3=document.createElement("button");b3.textContent="Copiar";b3.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(t);b3.textContent="Copiado";setTimeout(()=>b3.textContent="Copiar",1200)};
  a.append(b1,b2,b3);w.appendChild(a);col.appendChild(w);return c;
}
function abajo(){chat.scrollTop=chat.scrollHeight}
function pinta(){
  col.innerHTML="";
  if(!historial.length){saludo();return}
  historial.forEach(h=>h.role==="user"?añadeYo(h.text):añadeIA(h.text));
  abajo();
}
pinta();

/* ---------- adjuntos ---------- */
function chips(){
  const c=$("#chips");c.innerHTML="";
  adjuntos.forEach((f,i)=>{
    const s=document.createElement("span");s.className="chip";s.textContent=f.name;
    const x=document.createElement("button");x.type="button";x.textContent="✕";x.setAttribute("aria-label","Quitar");
    x.onclick=()=>{adjuntos.splice(i,1);chips()};s.appendChild(x);c.appendChild(s);
  });
}
$("#clip").onclick=()=>arch.click();
arch.onchange=()=>{adjuntos.push(...arch.files);arch.value="";chips()};

/* ---------- dictado ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
$("#mic").onclick=()=>{
  if(!SR){alert("Tu navegador no tiene dictado. Prueba con Chrome o Safari.");return}
  const b=$("#mic");
  if(rec){rec.stop();return}
  rec=new SR();rec.lang="es-BO";rec.interimResults=true;rec.continuous=true;
  const base=txt.value?txt.value+" ":"";
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;txt.value=base+t;autoAlto()};
  rec.onend=()=>{rec=null;b.classList.remove("rec")};
  rec.onerror=()=>{rec=null;b.classList.remove("rec")};
  rec.start();b.classList.add("rec");
};

/* ---------- envío ---------- */
function autoAlto(){txt.style.height="auto";txt.style.height=txt.scrollHeight+"px"}
txt.addEventListener("input",autoAlto);
txt.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();$("#f").requestSubmit()}});

$("#f").onsubmit=async e=>{
  e.preventDefault();
  if(rec)rec.stop();
  const t=txt.value.trim();
  if(ocupado||(!t&&!adjuntos.length))return;
  ocupado=true;$("#enviar").disabled=true;
  // desbloquea la voz en iPhone (necesita un toque del usuario)
  if(sint&&ajustes.auto){const u=new SpeechSynthesisUtterance(" ");u.volume=0;sint.speak(u)}
  const s=$("#saludo");if(s)s.remove();
  añadeYo((t||"(archivo)")+(adjuntos.length?"\n📎 "+adjuntos.map(f=>f.name).join(", "):""));
  const fd=new FormData();
  fd.append("message",t);fd.append("history",JSON.stringify(historial));
  adjuntos.forEach(f=>fd.append("files",f));
  txt.value="";autoAlto();adjuntos=[];chips();
  const cont=añadeIA("…");abajo();
  let respuesta=null;
  try{
    let clave=LS.get("clave","");
    const llama=()=>fetch("/chat",{method:"POST",body:fd,headers:{"X-Clave":clave}});
    let r=await llama();
    if(r.status===401){clave=prompt("Clave de acceso")||"";LS.set("clave",clave);r=await llama()}
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Error");
    respuesta=j.reply;
    cont.innerHTML=md(respuesta);
    historial.push({role:"user",text:t||"(archivo)"},{role:"model",text:respuesta});
    historial=historial.slice(-30);LS.set("hist",historial);
    if(ajustes.auto)hablar(respuesta);
  }catch(err){cont.textContent="No pude responder. "+err.message}
  ocupado=false;$("#enviar").disabled=false;abajo();
};

/* ---------- ajustes ---------- */
const dlg=$("#dlg");
function pintaAuto(){$("#auto").classList.toggle("on",!!ajustes.auto)}
pintaAuto();
$("#auto").onclick=()=>{ajustes.auto=!ajustes.auto;LS.set("aj",ajustes);pintaAuto();if(!ajustes.auto)callar()};
$("#ajustes").onclick=()=>{$("#vel").value=ajustes.vel;$("#tono").value=ajustes.tono;$("#tema").value=ajustes.tema;if(ajustes.voz)$("#voz").value=ajustes.voz;dlg.showModal()};
$("#cerrar").onclick=()=>dlg.close();
function guarda(){ajustes.voz=$("#voz").value;ajustes.vel=+$("#vel").value;ajustes.tono=+$("#tono").value;ajustes.tema=$("#tema").value;LS.set("aj",ajustes);aplicaTema()}
["voz","vel","tono","tema"].forEach(id=>$("#"+id).addEventListener("change",guarda));
$("#probar").onclick=()=>{guarda();hablar("Hola, soy Viernes. Así voy a sonar cuando te responda.")};
$("#borrar").onclick=()=>{historial=[];LS.set("hist",[]);pinta();dlg.close()};
$("#nuevo").onclick=()=>{callar();historial=[];LS.set("hist",[]);pinta()};
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
